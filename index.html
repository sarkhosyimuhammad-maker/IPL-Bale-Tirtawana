<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Digital - Bale Tirtawana</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#059669', secondary: '#0284c7' } } }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-12">

    <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-full text-emerald-600 shadow-inner">
                    <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">IPL Bale Tirtawana</h1>
                    <p class="text-xs text-emerald-100">Transparansi Data Pembayaran Warga • Real-time Otomatis</p>
                </div>
            </div>
            <div>
                <span id="loading-status" class="text-xs bg-emerald-700 px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5">
                    <span class="animate-pulse h-2 w-2 rounded-full bg-yellow-400"></span>Menghubungkan Database...
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium uppercase">Total Blok Terdata</p>
                <p id="stat-total-warga" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium uppercase">Status Sinkronisasi</p>
                <p id="stat-update-time" class="text-sm font-semibold text-gray-700 mt-2">Memuat data...</p>
            </div>
        </div>

        <!-- Filter Kluster -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <div class="max-w-md">
                <h3 class="text-xs font-bold text-gray-700 mb-2 uppercase tracking-wider flex items-center gap-1.5">PILIHAN PER KLUSTER BLOK</h3>
                <select id="filter-kluster" onchange="aksiPilihKlusterRT(this)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" disabled>
                    <option value="">Memuat data kluster...</option>
                </select>
            </div>
        </div>

        <!-- Filter Nomor Blok -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <div class="max-w-md">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Pilih Nomor Blok Warga</label>
                <select id="filter-blok" onchange="aksiPilihBlokWarga(this)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" disabled>
                    <option value="">-- Pilih Nomor Blok Warga Di Sini --</option>
                </select>
            </div>
        </div>

        <!-- Hasil Tabel Rincian -->
        <div id="container-tabel-hasil" class="hidden bg-white p-5 rounded-xl shadow-sm border border-gray-100 overflow-x-auto custom-scrollbar"></div>
    </main>

    <script>
        const SPREADSHEET_ID = '1_3LZ00GLXsfmp33KwazfBM6-OmLPw1gV';
        const SHEET_NAME = 'Sheet1'; 

        let formatWargaTerstruktur = {};
        let daftarKluster = new Set();

        window.addEventListener('DOMContentLoaded', () => {
            const url = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
            
            fetch(url)
                .then(res => res.text())
                .then(data => {
                    const jsonString = data.substring(data.indexOf("{"), data.lastIndexOf("}") + 1);
                    const jsonData = JSON.parse(jsonString);
                    restrukturisasiData(jsonData.table);
                })
                .catch(err => {
                    document.getElementById('loading-status').innerHTML = `<span class="h-2 w-2 rounded-full bg-red-500"></span> Gagal Terhubung`;
                    document.getElementById('stat-update-time').innerText = "Periksa Akses Berbagi Google Sheets";
                });
        });

        function restrukturisasiData(tabel) {
            if (!tabel || !tabel.rows.length) return;

            tabel.rows.forEach(row => {
                if (!row.c || row.c.length < 5) return;

                const noBlok = row.c[0] ? String(row.c[0].v).trim() : "";
                let namaWarga = row.c[1] ? String(row.c[1].v).trim() : "-";
                if(namaWarga.includes("|")) {
                    namaWarga = namaWarga.split("|")[1].trim();
                }

                const teksBulanRaw = row.c[2] ? String(row.c[2].v).trim() : ""; 
                const tglBayar = row.c[3] ? String(row.c[3].f || row.c[3].v).trim() : "-";
                const jumlahBayar = row.c[4] ? parseFloat(row.c[4].v) : 0;

                if (!noBlok || noBlok === "Blok") return; 

                const hurufKluster = noBlok.charAt(0).toUpperCase();
                if(/[A-Z]/.test(hurufKluster)) daftarKluster.add(hurufKluster);

                if (!formatWargaTerstruktur[noBlok]) {
                    formatWargaTerstruktur[noBlok] = {
                        idBlok: noBlok,
                        nama: namaWarga,
                        catatanIuran: {}
                    };
                }

                if(teksBulanRaw) {
                    const pecahan = teksBulanRaw.split(" ");
                    const kataBulan = pecahan.length > 1 ? pecahan[1].toLowerCase() : teksBulanRaw.toLowerCase();
                    
                    formatWargaTerstruktur[noBlok].catatanIuran[kataBulan] = {
                        jumlah: jumlahBayar,
                        tanggal: tglBayar
                    };
                }
            });

            const totalRumah = Object.keys(formatWargaTerstruktur).length;
            document.getElementById('stat-total-warga').innerText = totalRumah;
            document.getElementById('stat-update-time').innerText = `Otomatis Online (${new Date().toLocaleTimeString('id-ID')} WIB)`;
            document.getElementById('loading-status').innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-400"></span> Database Aktif`;

            const selectKluster = document.getElementById('filter-kluster');
            selectKluster.innerHTML = `<option value="">-- Pilih Kluster Huruf Di Sini (Misal: R) --</option>`;
            Array.from(daftarKluster).sort().forEach(k => {
                selectKluster.innerHTML += `<option value="${k}">Kluster ${k}</option>`;
            });
            selectKluster.disabled = false;
        }

        function aksiPilihKlusterRT(element) {
            const huruf = element.value;
            const selectBlok = document.getElementById('filter-blok');
            document.getElementById('container-tabel-hasil').className = "hidden";
            selectBlok.innerHTML = `<option value="">-- Pilih Nomor Blok Warga Di Sini --</option>`;

            if (!huruf) { selectBlok.disabled = true; return; }

            const urutanBlok = Object.keys(formatWargaTerstruktur)
                .filter(b => b.toUpperCase().startsWith(huruf))
                .sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));

            urutanBlok.forEach(b => {
                const warga = formatWargaTerstruktur[b];
                selectBlok.innerHTML += `<option value="${b}">${b} | ${warga.nama}</option>`;
            });
            selectBlok.disabled = false;
        }

        function aksiPilihBlokWarga(element) {
            const noBlok = element.value;
            const containerTabel = document.getElementById('container-tabel-hasil');
            if (!noBlok) { containerTabel.className = "hidden"; return; }

            const warga = formatWargaTerstruktur[noBlok];
            const listBulanIndo = [
                { key: 'jan', nama: 'Januari' }, { key: 'feb', nama: 'Februari' }, { key: 'mar', nama: 'Maret' },
                { key: 'apr', nama: 'April' }, { key: 'mei', nama: 'Mei' }, { key: 'jun', nama: 'Juni' },
                { key: 'jul', nama: 'Juli' }, { key: 'agu', nama: 'Agustus' }, { key: 'sep', nama: 'September' },
                { key: 'okt', nama: 'Oktober' }, { key: 'nop', nama: 'November' }, { key: 'des', nama: 'Desember' }
            ];

            let html = `
                <div class="mb-4 border-b border-gray-100 pb-3">
                    <h3 class="text-sm font-bold text-gray-800">Status Iuran IPL: <span class="text-emerald-600">${warga.idBlok}</span></h3>
